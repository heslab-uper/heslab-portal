name: Build and Deploy HESLab Portal

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 22 * * *"     # 05:00 WIB — jalankan build harian
  workflow_dispatch: {}       # tombol manual "Run workflow" di GitHub

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Build site (Python + Plotly -> docs/)
        run: python site/build_site.py

      - name: Commit generated docs/
        run: |
          git config user.name "heslab-bot"
          git config user.email "bot@heslab.local"
          git add docs/
          git commit -m "Auto-build site $(date +%Y-%m-%d)" || echo "No changes"
          git push
