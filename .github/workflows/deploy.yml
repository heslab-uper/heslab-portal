name: Build and Deploy HESLab Portal

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 22 * * *"     # 05:00 WIB — build harian (laporan kabupaten, dll)
  workflow_dispatch: {}       # tombol manual "Run workflow" di GitHub

permissions:
  contents: write            # wajib -- supaya step "Deploy to gh-pages" boleh push

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Build site (Python + Plotly -> docs/, LOKAL di runner saja)
        run: python site/build_site.py

      # docs/ di sini HANYA ada di dalam runner sementara -- TIDAK pernah
      # di-commit ke branch main. Langsung dipublish ke branch gh-pages,
      # dan force_orphan mereset riwayat branch itu setiap kali (supaya
      # commit per-jam/per-hari tidak menumpuk selamanya).
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          force_orphan: true
          user_name: "heslab-bot"
          user_email: "bot@heslab.local"
